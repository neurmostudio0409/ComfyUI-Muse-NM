name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy pytest

      - name: Syntax check
        run: python -m compileall config modules __init__.py

      - name: Run tests
        run: pytest tests -v

  release:
    # 推 v* tag 時自動打包 zip 並發 GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build package zip
        run: |
          mkdir -p dist/ComfyUI-Muse-NM
          cp -r __init__.py config modules web requirements.txt README.md install_requirements.bat dist/ComfyUI-Muse-NM/
          cd dist && zip -r ComfyUI-Muse-NM-${{ github.ref_name }}.zip ComfyUI-Muse-NM

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ComfyUI-Muse-NM-*.zip
          generate_release_notes: true
